[project]
name = "ebay-shopkeeper-backend"
version = "0.1.0"
description = "Backend for the Arcanum Collectibles Tavus shopkeeper: card search, PAL and conversations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
card-search = "back_end.search.cli:main"
shopkeeper-api = "back_end.server.app:main"
setup-pal = "back_end.pal.setup:main"
preflight = "back_end.pal.preflight:main"
review-call = "back_end.pal.review_call:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package is the `back_end` directory itself, imported as `back_end.*` from the repo
# root. Put the repo root on sys.path in the editable install so that works from anywhere.
[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
